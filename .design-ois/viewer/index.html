<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrchardsWood Screens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#EEF1F4;
    --chrome:#FFFFFF;
    --side:#12283F;
    --ink:#1A1F26;
    --ink-soft:#5A6572;
    --line:#DDE3E9;
    --accent:#2c64ac;
    --accent-deep:#1B4478;
    --green:#35661F;
    --shadow:0 2px 6px rgba(18,40,63,.08), 0 18px 44px -22px rgba(18,40,63,.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1419;
      --chrome:#161E26;
      --side:#0B1219;
      --ink:#E8ECEF;
      --ink-soft:#9AA6B2;
      --line:#26313B;
      --accent:#6FA8E0;
      --accent-deep:#9CC4EC;
      --green:#7FBF9C;
      --shadow:0 2px 6px rgba(0,0,0,.4), 0 18px 44px -22px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1419; --chrome:#161E26; --side:#0B1219; --ink:#E8ECEF;
    --ink-soft:#9AA6B2; --line:#26313B; --accent:#6FA8E0; --accent-deep:#9CC4EC;
    --green:#7FBF9C; --shadow:0 2px 6px rgba(0,0,0,.4), 0 18px 44px -22px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; display:flex; flex-direction:column;
    font-family:'Figtree', ui-sans-serif, system-ui, sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0; font-family:'Newsreader', Georgia, serif; font-weight:600;}
  button{font-family:inherit; cursor:pointer;}

  /* header */
  header{
    flex:none; height:58px; background:var(--chrome);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:16px; padding:0 18px;
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .mark{
    width:32px; height:32px; border-radius:8px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; flex:none;
    color:#fff; font-weight:800; font-size:11.5px; letter-spacing:-.02em;
  }
  .brand h1{font-size:16px; white-space:nowrap;}
  .count{
    font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums;
    padding-left:14px; border-left:1px solid var(--line); white-space:nowrap;
  }
  .spacer{flex:1 1 auto;}
  .ctrl{display:flex; align-items:center; gap:6px;}
  .btn{
    height:33px; padding:0 12px; border-radius:7px;
    border:1px solid var(--line); background:var(--chrome); color:var(--ink);
    font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{border-color:var(--accent);}
  .btn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* shell */
  .shell{flex:1 1 auto; display:flex; min-height:0;}

  nav{
    width:252px; flex:none; background:var(--side);
    overflow-y:auto; padding:14px 10px 24px;
  }
  .grp{
    font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:rgba(255,255,255,.38); padding:0 10px; margin:16px 0 6px;
  }
  .grp:first-child{margin-top:4px;}
  .item{
    display:flex; align-items:center; gap:9px; width:100%;
    padding:8px 10px; border-radius:7px; border:0; background:transparent;
    color:rgba(255,255,255,.74); font-size:13.5px; font-weight:500;
    text-align:left; line-height:1.35;
  }
  .item:hover{background:rgba(255,255,255,.07); color:#fff;}
  .item[aria-current="true"]{background:rgba(255,255,255,.13); color:#fff; font-weight:600;}
  .item:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .dot{width:5px; height:5px; border-radius:50%; background:currentColor; flex:none; opacity:.5;}
  .item[aria-current="true"] .dot{opacity:1;}

  /* stage */
  main{flex:1 1 auto; display:flex; flex-direction:column; min-width:0;}
  .bar{
    flex:none; padding:13px 20px; background:var(--chrome);
    border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  }
  .bar h2{font-size:17px;}
  .dim{font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .stage{
    flex:1 1 auto; overflow:auto; padding:22px;
    display:flex; justify-content:center; align-items:flex-start;
  }
  .holder{position:relative; flex:none;}
  .frame{
    display:block; border:0; background:#fff;
    box-shadow:var(--shadow); border-radius:10px;
    transform-origin:top left;
  }
  @media (max-width:820px){
    nav{width:190px;}
    .brand h1{display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">OIS</div>
    <h1>OrchardsWood Screens</h1>
  </div>
  <span class="count" id="count">—</span>
  <div class="spacer"></div>
  <div class="ctrl">
    <button class="btn" id="prev" title="Previous (←)">←</button>
    <button class="btn" id="next" title="Next (→)">→</button>
    <button class="btn" id="fit" aria-pressed="true">Fit</button>
    <button class="btn" id="full" aria-pressed="false">100%</button>
    <button class="btn" id="open">Open alone ↗</button>
  </div>
</header>

<div class="shell">
  <nav id="nav" aria-label="Screens"></nav>
  <main>
    <div class="bar">
      <h2 id="title">—</h2>
      <span class="dim" id="dim"></span>
    </div>
    <div class="stage" id="stage">
      <div class="holder" id="holder">
        <iframe class="frame" id="frame" title="Screen preview" loading="lazy"></iframe>
      </div>
    </div>
  </main>
</div>

<script>
const GROUPS = [
  ["Foundations", [
    ["Main", "Six decisions", 1280, 1500]
  ]],
  ["Backend architecture", [
    ["Architecture", "Domain model", 1280, 1300],
    ["BillingFlow", "Billing lifecycle & decisions", 1280, 1700]
  ]],
  ["Fees & enrolment", [
    ["PackageBuilder", "Package builder", 1280, 880],
    ["FeeStatement", "Fee statement (A4)", 794, 1123],
    ["ParentFees", "Parent — fees", 1280, 880]
  ]],
  ["Clubs & e-learning", [
    ["Clubs", "Clubs & activities", 1280, 880],
    ["Elearning", "E-learning admin", 1280, 880],
    ["StudentModule", "Student — working a module", 1280, 880]
  ]],
  ["Events, forms & ballots", [
    ["Events", "Events & ticketing", 1280, 880],
    ["Surveys", "Forms & surveys", 1280, 880],
    ["Voting", "Student council ballot", 1280, 880]
  ]],
  ["Public website", [
    ["Home", "Home", 1280, 2300],
    ["About", "About", 1280, 1980],
    ["Apply", "Admissions", 1280, 1220],
    ["Gallery", "Gallery", 1280, 1240],
    ["Calendar", "Calendar", 1280, 1260]
  ]],
  ["Dashboards", [
    ["Login", "Sign in", 1280, 860],
    ["DashAdmin", "Administrator", 1280, 880],
    ["DashTeacher", "Supervisor", 1280, 880],
    ["DashParent", "Parent", 1280, 880],
    ["DashStudent", "Student", 1280, 880]
  ]],
  ["Records", [
    ["Students", "Students", 1280, 880],
    ["Teachers", "Supervisors", 1280, 880],
    ["Classes", "Learning centres", 1280, 880],
    ["Attendance", "Attendance", 1280, 880],
    ["Grades", "Grade book", 1280, 880]
  ]],
  ["Report cards", [
    ["Reports", "Report cards", 1280, 880],
    ["ReportEditor", "Report editor", 1280, 880],
    ["ReportCard", "Printed card (A4)", 794, 1123]
  ]],
  ["School operations", [
    ["Announcements", "Announcements", 1280, 880],
    ["AmsCalendar", "School calendar", 1280, 880],
    ["Applications", "Admissions inbox", 1280, 880],
    ["GalleryAdmin", "Gallery manager", 1280, 880],
    ["Settings", "School settings", 1280, 880],
    ["Users", "Create parent account", 1280, 880]
  ]]
];

const FLAT = [];
GROUPS.forEach(([group, rows]) => rows.forEach(([stem, title, w, h]) => FLAT.push({ stem, title, w, h, group })));

const navEl = document.getElementById('nav');
const frame = document.getElementById('frame');
const holder = document.getElementById('holder');
const titleEl = document.getElementById('title');
const dimEl = document.getElementById('dim');
const countEl = document.getElementById('count');
const stage = document.getElementById('stage');
const fitBtn = document.getElementById('fit');
const fullBtn = document.getElementById('full');

let current = 0;
let mode = 'fit';

GROUPS.forEach(([group, rows]) => {
  const g = document.createElement('div');
  g.className = 'grp';
  g.textContent = group;
  navEl.appendChild(g);
  rows.forEach(([stem]) => {
    const i = FLAT.findIndex((s) => s.stem === stem);
    const b = document.createElement('button');
    b.className = 'item';
    b.type = 'button';
    b.innerHTML = '<span class="dot"></span><span></span>';
    b.lastChild.textContent = FLAT[i].title;
    b.addEventListener('click', () => select(i));
    b.dataset.index = String(i);
    navEl.appendChild(b);
  });
});

function applyScale() {
  const s = FLAT[current];
  const avail = stage.clientWidth - 44;
  const scale = mode === 'fit' ? Math.min(1, avail / s.w) : 1;
  frame.style.width = s.w + 'px';
  frame.style.height = s.h + 'px';
  frame.style.transform = 'scale(' + scale + ')';
  holder.style.width = Math.ceil(s.w * scale) + 'px';
  holder.style.height = Math.ceil(s.h * scale) + 'px';
  dimEl.textContent = s.w + ' × ' + s.h + (scale < 1 ? '  ·  shown at ' + Math.round(scale * 100) + '%' : '');
}

function select(i) {
  current = (i + FLAT.length) % FLAT.length;
  const s = FLAT[current];
  frame.src = 'screens/' + s.stem + '.html';
  titleEl.textContent = s.title;
  countEl.textContent = (current + 1) + ' of ' + FLAT.length + '  ·  ' + s.group;
  navEl.querySelectorAll('.item').forEach((b) => {
    b.setAttribute('aria-current', b.dataset.index === String(current) ? 'true' : 'false');
  });
  const active = navEl.querySelector('[aria-current="true"]');
  if (active) active.scrollIntoView({ block: 'nearest' });
  applyScale();
  stage.scrollTop = 0;
}

function setMode(m) {
  mode = m;
  fitBtn.setAttribute('aria-pressed', String(m === 'fit'));
  fullBtn.setAttribute('aria-pressed', String(m === 'full'));
  applyScale();
}

fitBtn.addEventListener('click', () => setMode('fit'));
fullBtn.addEventListener('click', () => setMode('full'));
document.getElementById('prev').addEventListener('click', () => select(current - 1));
document.getElementById('next').addEventListener('click', () => select(current + 1));
document.getElementById('open').addEventListener('click', () => {
  window.open('screens/' + FLAT[current].stem + '.html', '_blank');
});

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') { select(current - 1); e.preventDefault(); }
  if (e.key === 'ArrowRight') { select(current + 1); e.preventDefault(); }
});

let t;
window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(applyScale, 120); });

select(0);
</script>
</body>
</html>
